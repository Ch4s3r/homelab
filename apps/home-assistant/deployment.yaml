apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        config-hash: "{{ checksum of configmap }}"
        kubectl.kubernetes.io/restartedAt: "2025-06-14T12:05:00Z"
    spec:
      # Enable privileged mode for device access
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: config-init
        image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
        - sh
        - -c
        - |
          set -e
          echo "Initializing Home Assistant configuration..."
          
          # Create basic files if they don't exist
          touch /config/automations.yaml
          touch /config/scripts.yaml  
          touch /config/scenes.yaml
          
          # Always ensure HTTP configuration is present
          if [ ! -f /config/configuration.yaml ]; then
            echo "Creating new configuration.yaml..."
            cp /tmp/config/configuration.yaml /config/configuration.yaml
            chown 1000:1000 /config/configuration.yaml
          fi
          # Remove deprecated http: block if present from an old configuration.yaml.
          # HTTP proxy trust is now configured via the HA UI (Settings > System > Network).
          awk '/^http:/{skip=1; next} skip && /^[ \t]/{next} {skip=0; print}' /config/configuration.yaml > /config/configuration.yaml.tmp
          mv /config/configuration.yaml.tmp /config/configuration.yaml
          
          grep -q '^homeassistant:' /config/configuration.yaml || printf '\nhomeassistant:\n  packages: !include_dir_named packages\n' >> /config/configuration.yaml
          rm -rf /config/packages
          mkdir -p /config/packages
          cp /tmp/config/shelly_button_mode.yaml /config/packages/shelly_button_mode.yaml

          # Ensure proper ownership and permissions
          chown -R 1000:1000 /config/
          find /config -type f -exec chmod 644 {} \;
          find /config -type d -exec chmod 755 {} \;
          echo "Configuration initialization complete"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: ha-config
          mountPath: /tmp/config
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add:
            - CHOWN
            - FOWNER
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
        imagePullPolicy: Always
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: TZ
          value: "Europe/Vienna"
        ports:
        - containerPort: 8123
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        - name: dbus
          mountPath: /run/dbus
          readOnly: true
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        - name: dev
          mountPath: /dev
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      # Use host network for device discovery
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config-pvc
      - name: dbus
        hostPath:
          path: /run/dbus
          type: Directory
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      - name: ha-config
        configMap:
          name: home-assistant-config
      - name: dev
        hostPath:
          path: /dev
          type: Directory
