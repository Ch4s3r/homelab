apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Text to speech
    tts:
      - platform: google_translate

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  shelly_button_mode.yaml: |
    rest_command:
      shelly_rpc:
        url: "http://{{ host }}/rpc/{{ method }}"
        method: post
        content_type: application/json
        payload: "{{ payload }}"

    automation:
      - id: shelly_1pm_gen4_set_button_mode_on_new_device
        alias: Shelly 1PM Gen4 - set button mode on new device
        mode: queued
        triggers:
          - trigger: event
            event_type: device_registry_updated
            event_data:
              action: create
        conditions:
          - condition: template
            value_template: "{{ device_attr(trigger.event.data.device_id, 'manufacturer') == 'Shelly' }}"
        actions:
          - variables:
              shelly_hosts: >
                {{ integration_entities('shelly') | map('device_id') | unique
                   | map('device_attr', 'configuration_url') | select('string')
                   | map('regex_findall_index', '//([^:/]+)') | list }}
          - repeat:
              for_each: "{{ shelly_hosts }}"
              sequence:
                - action: rest_command.shelly_rpc
                  data:
                    host: "{{ repeat.item }}"
                    method: Shelly.GetDeviceInfo
                    payload: "{}"
                  response_variable: shelly_device_info
                - if:
                    - condition: template
                      value_template: "{{ shelly_device_info.content.model == 'S4SW-001P16EU' }}"
                  then:
                    - action: rest_command.shelly_rpc
                      data:
                        host: "{{ repeat.item }}"
                        method: Input.SetConfig
                        payload: '{"id":0,"config":{"type":"button"}}'
                    - action: rest_command.shelly_rpc
                      data:
                        host: "{{ repeat.item }}"
                        method: Switch.SetConfig
                        payload: '{"id":0,"config":{"in_mode":"momentary","initial_state":"restore_last"}}'
