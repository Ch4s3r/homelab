apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 30m
  chart:
    spec:
      chart: karakeep
      version: 0.33.1
      sourceRef:
        kind: HelmRepository
        name: karakeep
  values:
    applicationHost: karakeep
    controllers:
      karakeep:
        replicas: 0
        containers:
          karakeep:
            image:
              # renovate: datasource=docker depName=ghcr.io/karakeep-app/karakeep versioning=semver
              tag: 0.33.2
      chrome:
        containers:
          chrome:
            image:
              repository: docker.io/zenika/alpine-chrome
              # renovate: datasource=docker depName=docker.io/zenika/alpine-chrome
              tag: 124@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d
    ingress:
      karakeep:
        className: tailscale
        tls:
          - hosts:
              - karakeep
    meilisearch:
      replicaCount: 0
