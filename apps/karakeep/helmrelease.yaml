apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 30m
  chart:
    spec:
      chart: karakeep
      version: 0.35.1
      sourceRef:
        kind: HelmRepository
        name: karakeep
  values:
    applicationHost: karakeep
    controllers:
      karakeep:
        replicas: 1
        containers:
          karakeep:
            image:
              # renovate: datasource=docker depName=ghcr.io/karakeep-app/karakeep versioning=semver
              tag: 0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
      chrome:
        containers:
          chrome:
            image:
              # renovate: datasource=docker depName=ghcr.io/karakeep-app/karakeep-chrome
              tag: 158.0.8127.88-r2@sha256:c3c6c4c0ec25cc0a843bbf3bc92f51f6c4ba0bbf2bbcbef97854fc83cf88196d
              pullPolicy: IfNotPresent
    ingress:
      karakeep:
        className: tailscale
        tls:
          - hosts:
              - karakeep
