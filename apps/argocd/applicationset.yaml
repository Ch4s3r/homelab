apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/Ch4s3r/homelab.git
      revision: HEAD
      directories:
      - path: apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/Ch4s3r/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates[]?.apiVersion
            - .spec.volumeClaimTemplates[]?.kind
            - .spec.volumeClaimTemplates[]?.status
            - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          managedFieldsManagers:
            - k3s
          jqPathExpressions:
            - .status
        - group: postgresql.cnpg.io
          kind: Cluster
          jqPathExpressions:
            - .spec.postgresGID
            - .spec.postgresUID
            - .spec.logLevel
            - .spec.monitoring
            - .spec.probes
            - .spec.replicationSlots
            - .spec.postgresql.parameters
            - .spec.postgresql.syncReplicaElectionConstraint
            - .spec.primaryUpdateMethod
            - .spec.primaryUpdateStrategy
            - .spec.smartShutdownTimeout
            - .spec.startDelay
            - .spec.stopDelay
            - .spec.switchoverDelay
            - .spec.storage.resizeInUseVolumes
            - .spec.affinity
            - .spec.enablePDB
            - .spec.failoverDelay
            - .spec.maxSyncReplicas
            - .spec.minSyncReplicas
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated: 
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
