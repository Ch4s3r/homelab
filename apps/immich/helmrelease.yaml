apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server versioning=semver
              tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
            env:
              DB_HOSTNAME: immich-database-rw
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
            envFrom:
              - secretRef:
                  name: immich-secrets
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          size: 1Gi
          storageClass: local-path
          accessMode: ReadWriteOnce
    server:
      enabled: true
      ingress:
        main:
          enabled: false
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning versioning=semver
                tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          storageClass: local-path
          accessMode: ReadWriteOnce
